<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Secure Payment</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;

background:linear-gradient(-45deg,#0f172a,#1e3a8a,#2563eb,#0f172a);
background-size:400% 400%;
animation:bg 12s ease infinite;

}

@keyframes bg{

0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}

}

.circle{

position:absolute;
border-radius:50%;
background:rgba(255,255,255,.08);
animation:float 8s infinite ease-in-out;

}

.c1{

width:220px;
height:220px;
top:10%;
left:8%;

}

.c2{

width:170px;
height:170px;
bottom:8%;
right:10%;
animation-duration:10s;

}

.c3{

width:120px;
height:120px;
bottom:20%;
left:25%;
animation-duration:7s;

}

@keyframes float{

50%{

transform:translateY(-30px);

}

}

.card{

width:430px;

padding:40px;

border-radius:25px;

background:rgba(255,255,255,.12);

backdrop-filter:blur(15px);

box-shadow:0 25px 45px rgba(0,0,0,.3);

text-align:center;

color:white;

}

.logo{

font-size:55px;

margin-bottom:15px;

}

h1{

font-size:30px;

margin-bottom:10px;

}

.subtitle{

opacity:.8;

margin-bottom:35px;

}

.inputBox{

display:flex;

align-items:center;

background:white;

border-radius:15px;

padding:15px;

margin-bottom:30px;

}

.inputBox span{

font-size:30px;

font-weight:bold;

color:#0d6efd;

margin-right:10px;

}

input{

width:100%;

border:none;

outline:none;

font-size:24px;

}

button{

width:100%;

padding:16px;

font-size:18px;

font-weight:bold;

border:none;

border-radius:12px;

cursor:pointer;

background:linear-gradient(90deg,#00c6ff,#0072ff);

color:white;

transition:.3s;

}

button:hover{

transform:translateY(-4px);

box-shadow:0 20px 30px rgba(0,0,0,.4);

}

.features{

display:flex;

justify-content:space-between;

margin-top:30px;

font-size:14px;

opacity:.9;

}

.footer{

margin-top:25px;

font-size:13px;

opacity:.7;

}

.loader{

display:none;

margin-top:20px;

font-size:15px;

}

</style>

</head>

<body>

<div class="circle c1"></div>
<div class="circle c2"></div>
<div class="circle c3"></div>

<div class="card">

<div class="logo">💳</div>

<h1>Secure Payment</h1>

<div class="subtitle">

Fast • Secure • Trusted by Razorpay

</div>

<div class="inputBox">

<span>₹</span>

<input
type="number"
id="amount"
placeholder="Enter Amount">

</div>

<button onclick="payNow()">

Pay Securely →

</button>

<div class="loader" id="loader">

⏳ Creating Order...

</div>

<div class="features">

<div>🔒 Secure</div>

<div>⚡ Instant</div>

<div>💙 Razorpay</div>

</div>

<div class="footer">

Powered by Spring Boot + Razorpay

</div>

</div>

<script>
function payNow() {

    let amount = document.getElementById("amount").value;

    if (amount == "" || amount <= 0) {
        alert("Enter valid amount");
        return;
    }

    document.getElementById("loader").style.display = "block";

    fetch("http://localhost:8081/payments", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            amnt: amount
        })

    })
    .then(response => response.json())

    .then(data => {

        document.getElementById("loader").style.display = "none";

        var options = {

            key: "rzp_test_TIREhS9IIsqsKx",

            amount: data.amount,

            currency: data.currency,

            order_id: data.id,

            name: "Spring Boot Payment",

            description: "Razorpay Payment",

            handler: function(response) {

                alert("Payment Successful");

                console.log(response);

            },

            theme: {
                color: "#3399cc"
            }

        };

        var rzp = new Razorpay(options);

        rzp.open();

    })

    .catch(error => {

        document.getElementById("loader").style.display = "none";

        console.log(error);

        alert("Payment Failed");

    });

}

</script>

</body>

</html>
